<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:#0d1018}
.wrap{padding:22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sw{width:80px;height:80px;border-radius:var(--radius-2);border:1px solid var(--border-2)}
.nm{font-family:var(--font-sans);font-size:12px;color:#ebeefb;font-weight:500}
.hx{font-family:var(--font-mono);font-size:10.5px;color:rgba(235,238,251,0.55)}
</style></head><body class="dark"><div class="wrap">
<div class="col"><div class="sw" style="background:#5b8bff"></div><div class="nm">--primary</div><div class="hx">#5b8bff</div></div>
<div class="col"><div class="sw" style="background:#ff8a8a"></div><div class="nm">--danger</div><div class="hx">#ff8a8a</div></div>
<div class="col"><div class="sw" style="background:#f5c365"></div><div class="nm">--warning</div><div class="hx">#f5c365</div></div>
<div class="col"><div class="sw" style="background:#ebeefb"></div><div class="nm">--text</div><div class="hx">#ebeefb</div></div>
<div class="col"><div class="sw" style="background:#c2cae0"></div><div class="nm">--text-2</div><div class="hx">#c2cae0</div></div>
<div class="col"><div class="sw" style="background:rgba(235,238,251,0.5);border:1px dashed var(--border-2)"></div><div class="nm">--text-muted</div><div class="hx">.50 alpha</div></div>
</div></body></html>
