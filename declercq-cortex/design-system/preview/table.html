<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}

table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid rgba(168,192,240,0.08);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.18)}

mark.y{background:rgba(220,180,60,0.32);color:#fff5d6;padding:0 2px;border-radius:2px}
mark.b{background:rgba(90,150,230,0.32);color:#d6e6ff;padding:0 2px;border-radius:2px}
