<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0}
.stage{padding:22px;
  background:#0d1018;
  background-image:
    radial-gradient(ellipse 700px 500px at 12% 0%, rgba(122,162,255,0.40) 0%, transparent 65%),
    radial-gradient(ellipse 600px 400px at 95% 100%, rgba(169,139,255,0.35) 0%, transparent 60%);
  background-attachment:fixed;background-repeat:no-repeat;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.sw{width:104px;height:104px;border-radius:var(--radius-2);border:1px solid rgba(168,192,240,0.20);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);border-radius:var(--radius-2)}
.nm{font-family:var(--font-sans);font-size:12.5px;color:#ebeefb;font-weight:600}
.hx{font-family:var(--font-mono);font-size:10.5px;color:rgba(235,238,251,0.7)}
.use{font-family:var(--font-sans);font-size:10.5px;color:rgba(235,238,251,0.55)}
</style></head><body class="dark"><div class="stage"><div class="row">
<div class="col">
  <div class="sw" style="background:#0d1018"></div>
  <div class="nm">--bg</div><div class="hx">#0d1018</div><div class="use">canvas</div>
</div>
<div class="col">
  <div class="sw" style="background:#0a0d14"></div>
  <div class="nm">--bg-deep</div><div class="hx">#0a0d14</div><div class="use">sidebar, code</div>
</div>
<div class="col">
  <div class="sw" style="background:#1a1f2e"></div>
  <div class="nm">--bg-elev-solid</div><div class="hx">#1a1f2e</div><div class="use">opaque fallback</div>
</div>
<div class="col">
  <div class="sw" style="background:rgba(30,36,54,0.72);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px)"></div>
  <div class="nm">--bg-elev</div><div class="hx">30,36,54 · α 0.72</div><div class="use">toolbar, sidebar</div>
</div>
<div class="col">
  <div class="sw" style="background:rgba(26,31,46,0.86);backdrop-filter:saturate(150%) blur(20px);-webkit-backdrop-filter:saturate(150%) blur(20px)"></div>
  <div class="nm">--bg-card</div><div class="hx">26,31,46 · α 0.86</div><div class="use">welcome, modals</div>
</div>
</div></div></body></html>
