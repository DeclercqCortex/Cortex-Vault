<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.stage{padding:24px;display:flex;gap:14px;flex-wrap:wrap;
  background:#0d1018;
  background-image:radial-gradient(ellipse 700px 500px at 50% 50%, rgba(122,162,255,0.18) 0%, transparent 70%);}
.card{padding:14px 16px;border-radius:14px;border:1px solid rgba(168,192,240,0.16);background:rgba(26,31,46,0.86);backdrop-filter:saturate(150%) blur(20px);box-shadow:0 32px 60px -12px rgba(0,0,0,0.55),0 16px 28px -8px rgba(0,0,0,0.35);min-width:180px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:rgba(235,238,251,0.55);font-weight:600;margin-bottom:6px}
.h{font-size:13.5px;font-weight:600;margin:0 0 4px}
.b{font-size:12px;color:#c2cae0;margin:0}
</style></head><body><div class="stage">
<div class="card"><div class="tag">--blur-chrome</div><p class="h">Toolbar / sidebar</p><p class="b">saturate(160%) blur(12px)</p></div>
<div class="card"><div class="tag">--blur-modal</div><p class="h">Modals · welcome</p><p class="b">saturate(150%) blur(20px)</p></div>
<div class="card" style="backdrop-filter:saturate(180%) blur(28px)"><div class="tag">--blur-strong</div><p class="h">Splash glass</p><p class="b">saturate(180%) blur(28px)</p></div>
</div></body></html>
