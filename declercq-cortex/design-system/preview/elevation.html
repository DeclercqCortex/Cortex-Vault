<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:32px;display:flex;gap:30px;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.tile{width:96px;height:80px;border-radius:10px;background:#1a1f2e;border:1px solid rgba(168,192,240,0.16)}
.s1{box-shadow:0 1px 2px rgba(0,0,0,0.18),0 1px 1px rgba(0,0,0,0.10)}
.s2{box-shadow:0 6px 22px rgba(0,0,0,0.40),0 2px 6px rgba(0,0,0,0.18)}
.s3{box-shadow:0 32px 60px -12px rgba(0,0,0,0.55),0 16px 28px -8px rgba(0,0,0,0.35)}
.s-cta{background:linear-gradient(135deg,#7aa2ff,#a98bff);box-shadow:0 6px 18px rgba(122,162,255,0.4),inset 0 1px 0 rgba(255,255,255,0.18);border:none}
.nm{font-size:12px;font-weight:500}
.lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(235,238,251,0.55);text-align:center}
</style></head><body><div class="wrap">
<div class="col"><div class="tile s1"></div><div class="nm">--shadow-1</div><div class="lab">chips, code</div></div>
<div class="col"><div class="tile s2"></div><div class="nm">--shadow-2</div><div class="lab">cards, bubbles</div></div>
<div class="col"><div class="tile s3"></div><div class="nm">--shadow-3</div><div class="lab">modals</div></div>
<div class="col"><div class="tile s-cta"></div><div class="nm">cta halo</div><div class="lab">colored accent</div></div>
</div></body></html>
