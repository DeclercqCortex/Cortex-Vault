<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;color:#ebeefb;font-family:'Inter',sans-serif}
body{
  background-color:#0d1018;
  background-image:
    radial-gradient(ellipse 1100px 800px at 12% 0%, rgba(122,162,255,0.13) 0%, transparent 65%),
    radial-gradient(ellipse 900px 700px at 95% 100%, rgba(169,139,255,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 700px 500px at 50% 50%, rgba(74,222,188,0.07) 0%, transparent 70%);
  background-attachment:fixed;
  background-repeat:no-repeat;
}
.wrap{padding:22px;display:flex;flex-direction:column;gap:14px}
.exp{border:1px solid rgba(168,192,240,0.16);border-radius:6px;overflow:hidden;background:rgba(30,36,54,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.h{position:relative;padding:8px 12px 8px 28px;background:rgba(122,162,255,0.12);color:#7aa2ff;font-size:13px;font-weight:600;letter-spacing:.01em}
.h::before{content:"▸";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7aa2ff;font-size:11px}
.b{padding:8px 14px;color:#c2cae0;font-size:13px;line-height:1.55}
.foot{height:6px;background:rgba(122,162,255,0.12)}
.lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(235,238,251,0.5)}
</style></head><body><div class="wrap">
<div class="exp">
  <div class="h">Iteration · iter-3</div>
  <div class="b">Spiked PCR with new primer set; observed 1.4× yield over baseline.</div>
  <div class="foot"></div>
</div>
<span class="lab">.cortex-typed-block · header / body / end strip</span>
</div></body></html>
