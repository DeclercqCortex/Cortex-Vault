<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:#0d1018}
.wrap{padding:22px;display:flex;gap:18px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:rgba(122,162,255,0.18);border:1px solid rgba(168,192,240,0.16)}
.r1{width:72px;height:72px;border-radius:6px}
.r2{width:72px;height:72px;border-radius:10px}
.r3{width:72px;height:72px;border-radius:14px}
.rp{width:72px;height:72px;border-radius:999px}
.lab{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(235,238,251,0.6)}
.nm{font-family:'Inter',sans-serif;font-size:12px;color:#ebeefb;font-weight:500}
</style></head><body><div class="wrap">
<div class="col"><div class="box r1"></div><div class="nm">--radius-1</div><div class="lab">6px · chips</div></div>
<div class="col"><div class="box r2"></div><div class="nm">--radius-2</div><div class="lab">10px · cards</div></div>
<div class="col"><div class="box r3"></div><div class="nm">--radius-3</div><div class="lab">14px · modals</div></div>
<div class="col"><div class="box rp"></div><div class="nm">--radius-pill</div><div class="lab">999px · toggle</div></div>
</div></body></html>
