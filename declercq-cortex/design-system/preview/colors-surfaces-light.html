<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0}
.stage{padding:22px;
  background:#fbfbfd;
  background-image:
    radial-gradient(ellipse 700px 500px at 12% 0%, rgba(70,97,255,0.30) 0%, transparent 65%),
    radial-gradient(ellipse 600px 400px at 95% 100%, rgba(141,84,245,0.28) 0%, transparent 60%);
  background-attachment:fixed;background-repeat:no-repeat;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.sw{width:104px;height:104px;border-radius:var(--radius-2);border:1px solid rgba(15,23,42,0.18);box-shadow:0 6px 20px rgba(15,23,42,0.10);position:relative;overflow:hidden}
.sw::after{content:"";position:absolute;inset:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);border-radius:var(--radius-2)}
.nm{font-family:var(--font-sans);font-size:12.5px;color:#131623;font-weight:600}
.hx{font-family:var(--font-mono);font-size:10.5px;color:rgba(19,22,35,0.78)}
.use{font-family:var(--font-sans);font-size:10.5px;color:rgba(19,22,35,0.55)}
</style></head><body class="light"><div class="stage"><div class="row">
<div class="col">
  <div class="sw" style="background:#fbfbfd"></div>
  <div class="nm">--bg</div><div class="hx">#fbfbfd</div><div class="use">canvas</div>
</div>
<div class="col">
  <div class="sw" style="background:#f3f5fa"></div>
  <div class="nm">--bg-deep</div><div class="hx">#f3f5fa</div><div class="use">sidebar, code</div>
</div>
<div class="col">
  <div class="sw" style="background:#ffffff"></div>
  <div class="nm">--bg-elev-solid</div><div class="hx">#ffffff</div><div class="use">opaque fallback</div>
</div>
<div class="col">
  <div class="sw" style="background:rgba(255,255,255,0.78);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px)"></div>
  <div class="nm">--bg-elev</div><div class="hx">255 · α 0.78</div><div class="use">toolbar, sidebar</div>
</div>
<div class="col">
  <div class="sw" style="background:rgba(255,255,255,0.92);backdrop-filter:saturate(150%) blur(20px);-webkit-backdrop-filter:saturate(150%) blur(20px)"></div>
  <div class="nm">--bg-card</div><div class="hx">255 · α 0.92</div><div class="use">welcome, modals</div>
</div>
</div></div></body></html>
