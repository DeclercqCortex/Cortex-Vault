<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100vh;
  background-color:#141a2c;
  background-image:
    radial-gradient(ellipse 300% 270% at 0% 0%,    rgba(122,162,255,0.10) 0%, rgba(122,162,255,0.02) 100%),
    radial-gradient(ellipse 300% 270% at 100% 100%, rgba(169,139,255,0.10) 0%, rgba(169,139,255,0.02) 100%),
    radial-gradient(ellipse 270% 240% at 100% 0%,  rgba(122,162,255,0.06) 0%, rgba(122,162,255,0.01) 100%),
    radial-gradient(ellipse 270% 240% at 0% 100%,  rgba(169,139,255,0.06) 0%, rgba(169,139,255,0.01) 100%),
    radial-gradient(ellipse 210% 180% at 50% 50%,  rgba(74,222,188,0.04)  0%, transparent 100%);
  background-attachment:fixed;background-repeat:no-repeat;
  display:flex;align-items:center;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:18px}
.lab{font:500 11px/1 'JetBrains Mono',monospace;color:rgba(235,238,251,0.55);letter-spacing:.18em;text-transform:uppercase}
object{width:320px;height:auto;display:block}
</style></head><body>
<div class="card">
  <object data="../assets/cortex-mark.svg" type="image/svg+xml"></object>
  <span class="lab">Brand mark · on aurora</span>
</div>
</body></html>
