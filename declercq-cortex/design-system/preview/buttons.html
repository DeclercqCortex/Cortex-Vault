<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
button{font-family:inherit}
.btn{font-size:0.7rem;padding:3px 9px;cursor:pointer;background:transparent;color:#c2cae0;border:1px solid rgba(168,192,240,0.16);border-radius:6px;transition:all 120ms cubic-bezier(0.25,0.8,0.4,1)}
.btn.icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;padding:0}
.btn:hover{background:rgba(122,162,255,0.12);border-color:rgba(122,162,255,0.22);color:#ebeefb}
.cta{padding:10px 18px;border:none;border-radius:10px;font-size:14px;font-weight:500;color:#fff;background:linear-gradient(135deg,#7aa2ff,#a98bff);box-shadow:0 6px 18px rgba(122,162,255,0.3),inset 0 1px 0 rgba(255,255,255,0.18);cursor:pointer}
.cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(235,238,251,0.5)}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
</style></head><body><div class="wrap">
<div class="col"><button class="btn">+ Note</button><span class="lab">.changeBtn · default</span></div>
<div class="col"><button class="btn" style="background:rgba(122,162,255,0.12);border-color:rgba(122,162,255,0.22);color:#ebeefb">+ Note</button><span class="lab">:hover</span></div>
<div class="col"><button class="btn icon">↻</button><span class="lab">.iconBtn</span></div>
<div class="col"><button class="cta">Choose vault folder</button><span class="lab">data-aurora-cta</span></div>
</div></body></html>
