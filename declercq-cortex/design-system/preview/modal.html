<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:30px;display:flex;justify-content:center;align-items:flex-start;background:rgba(7,10,18,0.55)}
.modal{width:480px;border-radius:14px;background:rgba(26,31,46,0.86);border:1px solid rgba(168,192,240,0.16);box-shadow:0 32px 60px -12px rgba(0,0,0,0.55),0 16px 28px -8px rgba(0,0,0,0.35);backdrop-filter:saturate(150%) blur(20px);overflow:hidden}
.head{padding:14px 18px;background:linear-gradient(180deg,rgba(122,162,255,0.06),transparent);border-bottom:1px solid rgba(168,192,240,0.08);display:flex;align-items:center;justify-content:space-between}
.title{font-size:14px;font-weight:600}
.close{background:transparent;border:1px solid rgba(168,192,240,0.16);border-radius:6px;color:#c2cae0;width:24px;height:24px;cursor:pointer;font-family:inherit}
.body{padding:18px;font-size:13px;color:#c2cae0;line-height:1.6}
.footer{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid rgba(168,192,240,0.08)}
.btn{padding:7px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500}
.btn.s{background:transparent;color:#c2cae0;border:1px solid rgba(168,192,240,0.16)}
.btn.p{background:linear-gradient(135deg,#7aa2ff,#a98bff);color:#fff;border:none;box-shadow:0 6px 18px rgba(122,162,255,0.3)}
</style></head><body><div class="wrap"><div class="modal">
<div class="head"><span class="title">Insert experiment block</span><button class="close">×</button></div>
<div class="body">Wraps the selected paragraphs in a typed block (header · body · end strip). Use Ctrl+Shift+B to insert at caret.</div>
<div class="footer"><button class="btn s">Cancel</button><button class="btn p">Insert</button></div>
</div></div></body></html>
