<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:30px;display:flex;justify-content:center;align-items:center;
  background-image:radial-gradient(ellipse 700px 500px at 50% 50%, rgba(122,162,255,0.14) 0%, transparent 70%);}
.card{width:540px;padding:32px 36px;border-radius:14px;background:rgba(26,31,46,0.86);border:1px solid rgba(168,192,240,0.16);box-shadow:0 32px 60px -12px rgba(0,0,0,0.55),0 16px 28px -8px rgba(0,0,0,0.35);backdrop-filter:saturate(150%) blur(20px)}
h1{margin:0 0 12px;font-size:1.6rem;font-weight:600;letter-spacing:-.005em}
p{margin:0 0 12px;font-size:.95rem;color:#c2cae0;line-height:1.55}
.cta{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:500;color:#fff;background:linear-gradient(135deg,#7aa2ff,#a98bff);box-shadow:0 6px 18px rgba(122,162,255,0.3),inset 0 1px 0 rgba(255,255,255,0.18);cursor:pointer;font-family:inherit;margin-top:8px}
.hint{margin-top:14px;font-size:.78rem;color:rgba(235,238,251,0.5)}
</style></head><body><div class="wrap"><div class="card">
<h1>Welcome to Cortex</h1>
<p>A local-first research notebook. Pick a folder of markdown files to begin — every note, experiment, and protocol lives on disk.</p>
<button class="cta">Choose vault folder</button>
<div class="hint">Ctrl+K to search · Ctrl+/ for shortcuts</div>
</div></div></body></html>
