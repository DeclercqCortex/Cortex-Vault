<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:24px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:18px}
.lab{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(235,238,251,0.5);min-width:160px}
.bar{background:rgba(122,162,255,0.45);height:14px;border-radius:4px}
.t1{width:120px}.t2{width:220px}.t3{width:380px}
.dur{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7aa2ff;min-width:60px}
</style></head><body><div class="wrap">
<div class="row"><span class="lab">--motion-fast</span><div class="bar t1"></div><span class="dur">120ms</span></div>
<div class="row"><span class="lab">--motion-medium</span><div class="bar t2"></div><span class="dur">220ms</span></div>
<div class="row"><span class="lab">--motion-slow</span><div class="bar t3"></div><span class="dur">380ms</span></div>
<div class="row"><span class="lab">--ease</span><span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#c2cae0">cubic-bezier(0.25, 0.8, 0.4, 1)</span></div>
<div class="row"><span class="lab">ambient (brain)</span><span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#c2cae0">24–32s · per revolution</span></div>
</div></body></html>
