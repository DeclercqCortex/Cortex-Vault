<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif;
  background-image:
    radial-gradient(ellipse 700px 500px at 12% 0%, rgba(122,162,255,0.40) 0%, transparent 65%),
    radial-gradient(ellipse 600px 400px at 95% 100%, rgba(169,139,255,0.35) 0%, transparent 60%);
  background-attachment:fixed;background-repeat:no-repeat;}
.wrap{padding:22px;display:flex;gap:18px;align-items:center}
.seg{display:inline-flex;border:1px solid rgba(168,192,240,0.16);border-radius:5px;overflow:hidden}
.seg button{font-family:inherit;font-size:.7rem;padding:2px 10px;cursor:pointer;border:none;border-right:1px solid rgba(168,192,240,0.16);background:transparent;color:#c2cae0}
.seg button:last-child{border-right:none}
.seg button.act{background:rgba(122,162,255,0.22);color:#7aa2ff}
.lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(235,238,251,0.55)}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

.bell{position:relative;width:30px;height:30px;border-radius:6px;
  border:1px solid rgba(168,192,240,0.16);
  background:linear-gradient(135deg, rgba(122,162,255,0.18) 0%, rgba(169,139,255,0.18) 100%);
  display:inline-flex;align-items:center;justify-content:center;color:#ebeefb}
.bell svg{width:16px;height:16px;display:block;color:#ebeefb}
.bell.unread{
  background:linear-gradient(135deg, #7aa2ff 0%, #a98bff 100%);
  border-color:transparent;
  box-shadow:0 0 0 2px rgba(122,162,255,0.45),0 0 18px rgba(169,139,255,0.5);
  animation:bellPulse 2.4s ease-in-out infinite;}
.bell.unread svg{color:#ffffff}
.bell .dot{position:absolute;top:-3px;right:-3px;background:#ff8a8a;color:#fff;font-size:9px;font-weight:600;border-radius:999px;padding:1px 5px;box-shadow:0 2px 6px rgba(0,0,0,0.4)}
@keyframes bellPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(122,162,255,0.45),0 0 14px rgba(122,162,255,0.45)}
  50%   {box-shadow:0 0 0 2px rgba(169,139,255,0.55),0 0 26px rgba(169,139,255,0.55)}
}
</style></head><body><div class="wrap">
<div class="col">
  <div class="seg"><button>Auto</button><button class="act">Light</button><button>Dark</button></div>
  <span class="lab">ThemeToggle · 3-way</span>
</div>

<div class="col">
  <div class="bell" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 2.5 6.5H3.5C4.5 13.5 6 12 6 8Z"/>
      <path d="M10 19a2 2 0 0 0 4 0"/>
    </svg>
  </div>
  <span class="lab">Bell · idle (aurora tint)</span>
</div>

<div class="col">
  <div class="bell unread" aria-label="3 unread notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 2.5 6.5H3.5C4.5 13.5 6 12 6 8Z"/>
      <path d="M10 19a2 2 0 0 0 4 0"/>
    </svg>
    <span class="dot">3</span>
  </div>
  <span class="lab">Bell · unread (accent gradient + halo pulse)</span>
</div>
</div></body></html>
