<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:13px;color:#ebeefb;cursor:pointer;position:relative;transition:background 120ms cubic-bezier(0.25,0.8,0.4,1)}
.row.sel{background:rgba(122,162,255,0.22)}
.row.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(180deg,#7aa2ff,#a98bff)}
.row.sel{padding-left:14px}
.row:hover:not(.sel){background:rgba(122,162,255,0.08)}
.chev{display:inline-block;width:14px;color:rgba(235,238,251,0.5);transition:transform 200ms cubic-bezier(0.25,0.8,0.4,1)}
.chev.exp{transform:rotate(90deg)}
.fld{color:#c2cae0;font-weight:500}
.fil{color:#c2cae0}
.dirty{color:#f5c365;margin-left:4px}
</style></head><body><div class="wrap">
<div class="row"><span class="chev exp">▸</span><span class="fld">02-Daily Log</span></div>

</div></body></html>
