<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0d1018;color:#ebeefb;font-family:'Inter',sans-serif}
.wrap{padding:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:4px;padding:5px 10px;background:linear-gradient(180deg,rgba(30,36,54,0.72),#0a0d14);backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid rgba(168,192,240,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.04)}
.btn{font-size:12px;padding:3px 7px;border-radius:5px;border:1px solid rgba(168,192,240,0.16);background:transparent;color:#c2cae0;cursor:pointer;font-family:inherit;font-weight:500;min-width:22px;height:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.btn.act{background:linear-gradient(135deg,rgba(122,162,255,0.3),rgba(169,139,255,0.3));color:#fff;border-color:transparent;box-shadow:0 0 0 3px rgba(122,162,255,0.12)}
.btn.icon{width:22px;padding:0}
.sep{width:1px;height:14px;background:rgba(168,192,240,0.12);margin:0 3px}
.body{padding:18px;font-size:11px;color:rgba(235,238,251,0.5);font-family:'JetBrains Mono',monospace}
</style></head><body><div class="wrap">
<div class="toolbar">
<button class="btn act"><b>B</b></button>
<button class="btn"><i>I</i></button>
<button class="btn"><u>U</u></button>
<div class="sep"></div>
<button class="btn">H1</button><button class="btn">H2</button>
<div class="sep"></div>
<button class="btn icon">≡</button>
<button class="btn icon">⊞</button>
<div class="sep"></div>
<button class="btn">Inter ▾</button>
<button class="btn">15 ▾</button>
</div>
<div class="body">EditorToolbar · sticky, glass, 1px inner-top highlight, active = accent gradient + 4px halo</div>
</div></body></html>
