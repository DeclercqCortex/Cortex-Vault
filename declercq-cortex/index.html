<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <!--
      Cluster 21 v1.1 polish — Google Fonts for the toolbar's font-family
      picker. Loaded once at app start; users with no internet fall back
      to the system stack baked into each font's CSS value.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600;700&family=Pacifico&family=Bebas+Neue&family=Cinzel:wght@400;600;700&family=Fira+Code:wght@400;500;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    />
    <!--
      Cluster 21 v1.2.2 — KaTeX from CDN. The cortexMathBlock NodeView
      calls katex.render() against the node's `latex` attribute so
      the document shows rendered math instead of LaTeX source. CSS
      styles the KaTeX output; JS exposes window.katex. Loaded with
      `defer` so the script doesn't block React's first paint; the
      NodeView polls window.katex briefly on mount and falls back to
      plain text if it never arrives (e.g. offline).
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
